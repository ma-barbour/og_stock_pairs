name: Daily O&G Screener

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: # This adds a manual "Run Now" button on the GitHub website

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Maximizes package installation speed on Linux

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::tidyquant
            any::glmnet
            any::jsonlite
            any::tidymodels
            any::urca
            any::slider
            any::lubridate
            any::zoo
            any::tidyr

      - name: Run Data Pipeline Script
        run: Rscript update_data.R

      - name: Commit and Push Updated JSON Data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add data/*.json
          git diff-index --quiet HEAD || git commit -m "Automated Daily Screener Update [skip ci]"
          git push